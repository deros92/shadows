<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadows Demo Chat</title>
  <style>
    :root { --fg: #1b1f27; --muted: #5b6270; --bg: #f6f7f9; --card: #fff; --line: #e3e6eb; --accent: #2563eb; --user: #e8efff; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #111318; --card: #1a1d24; --line: #2d323c; --accent: #60a5fa; --user: #1e2a44; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 20px; }
    p.lead { margin: 0; color: var(--muted); }
    #chat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 220px; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 12px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { background: var(--user); align-self: flex-end; }
    .bot { background: var(--bg); border: 1px solid var(--line); }
    form { display: flex; gap: 8px; }
    textarea { flex: 1; min-height: 90px; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    #send { align-self: flex-end; font: 600 15px system-ui, sans-serif; padding: 10px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    summary { cursor: pointer; font-weight: 600; }
    #wire { margin: 8px 0 0; font: 13px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; }
    .examples button { font: 13px system-ui, sans-serif; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Chat di prova</h1>
  <p class="lead">Una finta AI che ripete ciò che riceve. Con l'estensione Shadows attiva, prova a inviare un messaggio con dati sensibili.</p>

  <div class="examples" aria-label="Esempi">
    <button type="button" data-text="Analizza il contratto con SuperMercati Bianchi per 2.000.000 euro: i termini di pagamento a 90 giorni sono vantaggiosi?">Contratto cliente</button>
    <button type="button" data-text="Scrivi una mail a mario.rossi@megastore.it (cell 347 123 4567) per confermare il bonifico su IT60 X054 2811 1010 0000 0123 456.">Mail con IBAN</button>
    <button type="button" data-text="Perché il server 10.0.12.5 rifiuta il login? password: Estate2026!">Credenziali</button>
    <button type="button" data-text="Come scrivo un volantino promozionale efficace?">Domanda innocua</button>
  </div>

  <div id="chat" aria-live="polite"></div>

  <form id="composer">
    <textarea id="prompt" placeholder="Scrivi un messaggio…"></textarea>
    <button id="send" type="submit" data-testid="send-button">Invia</button>
  </form>

  <details open>
    <summary>Cosa ha ricevuto davvero l'"AI"</summary>
    <div id="wire" data-shadows-ignore>(ancora niente)</div>
  </details>
</main>
<script>
  const chat = document.getElementById('chat');
  const prompt = document.getElementById('prompt');
  const wire = document.getElementById('wire');

  function bubble(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.append(div);
    div.scrollIntoView({ block: 'end' });
  }

  document.getElementById('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = prompt.value.trim();
    if (!text) return;
    bubble(text, 'user');
    wire.textContent = text;
    prompt.value = '';
    setTimeout(() => bubble('Ho ricevuto: "' + text + '". Rispondo usando gli stessi riferimenti.', 'bot'), 500);
  });

  prompt.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('composer').requestSubmit();
    }
  });

  document.querySelectorAll('.examples button').forEach((b) =>
    b.addEventListener('click', () => { prompt.value = b.dataset.text; prompt.focus(); }));
</script>
</body>
</html>
