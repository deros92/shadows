[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadows"
version = "0.1.0"
description = "Anonimizzazione locale dei prompt prima dell'invio alle AI in chat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "torch>=2.4",
    "transformers>=4.48",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pypdfium2>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
shadows = "shadows.__main__:main"

[tool.setuptools.packages.find]
include = ["shadows*"]

[tool.setuptools.package-data]
shadows = ["static/*.html", "vendor/rizzo_pii/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
