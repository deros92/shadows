<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Shadows</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1f27; --muted: #5b6270; --bg: #fff; --line: #e5e7eb; --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #16181d; --line: #2d323c; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; } }
    body { margin: 0; width: 340px; background: var(--bg); color: var(--fg); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0; }
    h1.brand { display: flex; align-items: center; gap: 8px; }
    section { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
    .status { font-weight: 600; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; color: var(--muted); }
    dd { margin: 0; color: var(--fg); }
    label.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; flex-wrap: wrap; }
    select { max-width: 100%; }
    select, input[type=text] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    button { font: 600 13px system-ui, sans-serif; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); }
    .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .msg { color: var(--muted); margin: 6px 0 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1 class="brand"><img src="icons/icon48.png" alt="" width="28" height="28"> Shadows</h1>
    <label class="row"><input type="checkbox" id="enabled"> attivo</label>
  </header>

  <section>
    <h2>Servizio locale</h2>
    <div id="status" class="status">verifica…</div>
    <dl id="detectors"></dl>
  </section>

  <section>
    <h2>Documento</h2>
    <input type="file" id="file" accept=".pdf,.docx,.txt,.md,.csv,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp">
    <p id="docmsg" class="msg"></p>
    <div id="docresult" class="hidden">
      <textarea id="doctext" readonly></textarea>
      <div class="actions">
        <button class="primary" id="insert">Inserisci nella chat</button>
        <button id="copy">Copia</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Ripristina valori reali</h2>
    <textarea id="restorein" placeholder="Incolla qui la risposta dell'AI con i [PLACEHOLDER]"></textarea>
    <div class="actions">
      <button class="primary" id="restorego">Ripristina e copia</button>
    </div>
    <p id="restoremsg" class="msg"></p>
  </section>

  <section>
    <h2>Impostazioni</h2>
    <label class="row">valori reali nelle risposte
      <select id="restore">
        <option value="safe">al passaggio del mouse e nella copia (sicuro)</option>
        <option value="dom">dentro la pagina (leggibili dal sito)</option>
        <option value="off">mai</option>
      </select>
    </label>
    <p id="restorewarn" class="msg hidden">Attenzione: gli script del sito (telemetria, registrazione delle sessioni) possono leggere e inviare i valori ripristinati nella pagina.</p>
    <label class="row"><input type="checkbox" id="blockFiles"> blocca gli allegati diretti alla chat</label>
    <label class="row">se il servizio è spento
      <select id="failMode">
        <option value="ask">chiedi</option>
        <option value="closed">blocca</option>
        <option value="open">invia senza controllo</option>
      </select>
    </label>
    <div class="actions"><button id="clear">Dimentica le mappe di questa sessione</button></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
